name: Backend CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'back-end/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'back-end/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-end
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Change to your PHP version
          extensions: mbstring, xml, json, curl, zip, unzi, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate
      
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Tests
        run: php artisan test

      - name: Audit Security Vulnerabilities
        run: composer audit

  build_and_push_backend:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Verify Docker Hub secrets are present
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then echo "Missing DOCKERHUB_USERNAME secret" && exit 1; fi
          if [ -z "${DOCKERHUB_PASSWORD}" ]; then echo "Missing DOCKERHUB_PASSWORD secret" && exit 1; fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Prepare Docker Hub namespace
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USER_LOWER=$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')
          echo "ns=${USER_LOWER}" >> $GITHUB_OUTPUT


      - name: Build and push backend-php image
        uses: docker/build-push-action@v3
        with:
          context: ./back-end
          file: ./back-end/dockerfiles/php.dockerfile
          push: true
          tags: docker.io/${{ steps.dh.outputs.ns }}/azubi-backend-php:latest
          build-args: |
            UID=1001
            GID=1001
            USER=runner

      - name: Build and push backend-nginx image
        uses: docker/build-push-action@v3
        with:
          context: ./back-end
          file: ./back-end/dockerfiles/nginx.dockerfile
          push: true
          tags: docker.io/${{ steps.dh.outputs.ns }}/azubi-backend-nginx:latest
          build-args: |
            UID=1001
            GID=1001
            USER=runner
